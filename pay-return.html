<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Hepcat — ritorno pagamento</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #0f1c1e;
				color: #f4ecd8;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				text-align: center;
				padding: 24px;
			}
			.card {
				max-width: 22rem;
			}
			h1 {
				font-size: 1.25rem;
				margin: 0 0 0.5rem;
			}
			p {
				color: #b9c4c2;
				line-height: 1.5;
				margin: 0 0 1.5rem;
			}
			a.btn {
				display: inline-block;
				background: #e0b64a;
				color: #0f1c1e;
				font-weight: 700;
				text-decoration: none;
				padding: 0.75rem 1.5rem;
				border-radius: 0.75rem;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1 id="title">Torniamo su Hepcat…</h1>
			<p id="msg">Se l'app non si apre da sola, tocca il pulsante.</p>
			<a class="btn" id="deeplink" href="#">Apri Hepcat</a>
		</div>
		<script>
			// Ponte https → deep link dell'app. La verità del pagamento la scrive il
			// webhook a DB: questa pagina serve solo a riportare in app, dove
			// l'iscrizione viene ri-letta (riconciliazione).
			(function () {
				var params = new URLSearchParams(location.search);
				var rid = params.get('rid') || '';
				var status = params.get('status') || 'success';
				// Su successo si va al pass dell'iscrizione; su annullo, in home.
				var deeplink =
					status === 'success' && rid ? 'SwingLog://pass/' + encodeURIComponent(rid) : 'SwingLog://';
				var link = document.getElementById('deeplink');
				link.setAttribute('href', deeplink);
				if (status !== 'success') {
					document.getElementById('title').textContent = 'Pagamento annullato';
					document.getElementById('msg').textContent =
						"Nessun addebito. Torna su Hepcat per riprovare.";
				}
				// Tentativo di apertura automatica.
				location.href = deeplink;
			})();
		</script>
	</body>
</html>
