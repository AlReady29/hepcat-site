<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tile ottanio scuro con cornice oro sottile (Art Deco) -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#0a1a1f"/>
  <rect x="2.75" y="2.75" width="26.5" height="26.5" rx="4.5" fill="none"
        stroke="#d4a843" stroke-width="1" opacity="0.55"/>
  <!-- Monogramma H -->
  <g fill="#d4a843">
    <rect x="9" y="8" width="3" height="16"/>
    <rect x="20" y="8" width="3" height="16"/>
    <rect x="12" y="14.5" width="8" height="3"/>
  </g>
  <!-- Diamante centrale sul traversino (richiamo all'ornamento del sito) -->
  <rect x="14.6" y="14.6" width="2.8" height="2.8" fill="#0a1a1f" transform="rotate(45 16 16)"/>
</svg>
